name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

permissions:
  contents: read
  actions: read

jobs:
  build:
    strategy:
      matrix:
        app: [api, web, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      - run: npm run build
        working-directory: apps/${{ matrix.app }}
      # apps/web lints with eslint-config-next; api and agent have no lint script yet, so
      # --if-present is a deliberate no-op there.
      - run: npm run lint --if-present
        working-directory: apps/${{ matrix.app }}
      # apps/web has no test suite yet, so --if-present is a deliberate no-op there; api and
      # agent run their jest suites.
      - run: npm test --if-present
        working-directory: apps/${{ matrix.app }}
      # Known-vulnerable npm packages fail the build (same level as studylife-capture/focus);
      # the Trivy scan after the release only covers the two container images, not apps/agent.
      # --omit=dev: GHSA-vfj7-8cjw-p6xm (braces, no patched release) only reaches the build via
      # the eslint-config-next lint chain, which is never shipped.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/${{ matrix.app }}

  # ------------------------------------------------------------------
  # Version / docker / release — push to main only
  # ------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@ccd513e3fa47d8a6e6f374fe1d6c561232807b65 # v0.8.0
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@ccd513e3fa47d8a6e6f374fe1d6c561232807b65 # v0.8.0
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  docker-smoke-check:
    needs: [get-version, release]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          load: true
          tags: claude-queue-${{ matrix.image }}:smoke-check
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64
      - name: Smoke-check api
        if: matrix.image == 'api'
        # 401 on a guarded route proves the app booted, migrated and serves requests.
        run: |
          docker run -d --name api-smoke --network host \
            -e DATABASE_URL=postgresql://smoke:smoke@localhost:5432/smoke \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_SECRET=smoke -e CLAUDE_KEY_ENCRYPTION_SECRET=smoke \
            claude-queue-api:smoke-check
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/auth/me || true)
            if [ "$code" = "401" ]; then
              echo "container is healthy"
              docker rm -f api-smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy in time"
          docker logs api-smoke
          docker rm -f api-smoke
          exit 1
      - name: Smoke-check web
        if: matrix.image == 'web'
        run: |
          docker run -d --name web-smoke -p 3000:3000 claude-queue-web:smoke-check
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "container is healthy"
              docker rm -f web-smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy in time"
          docker logs web-smoke
          docker rm -f web-smoke
          exit 1

  docker-build-push:
    # One native runner per platform instead of a single QEMU-emulated
    # multi-platform build; each leg pushes by digest only and
    # docker-manifest-merge stitches them into the multi-arch tags.
    needs: [get-version, release, docker-smoke-check]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    strategy:
      fail-fast: true
      matrix:
        image: [api, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
      IMAGE: ghcr.io/lukislp/claude-queue-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard against duplicate tag
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            echo "::error::registry tag ${{ env.NEXT_VERSION }} already exists (version race with a parallel run). Do NOT retry this run; wait for it to finish, then push again to produce a fresh version."
            exit 1
          fi
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          # NEXT_PUBLIC_API_URL is baked into the web bundle at build time.
          build-args: |
            NEXT_PUBLIC_API_URL=https://claudequeue-api.lukas2311-homelab.com
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          # Supply chain (2026-09-11 hardening): BuildKit attaches a SLSA provenance attestation
          # (which commit/workflow built this, from which base image) and an SPDX SBOM to every
          # per-arch image. They travel as extra "unknown/unknown" platform entries inside the
          # pushed index - GHCR shows them as such, containerd/k3s ignore them when pulling,
          # Trivy resolves the real linux/amd64 entry. imagetools create below carries them into
          # the multi-arch manifest unchanged.
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest-merge:
    needs: [get-version, docker-build-push]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    strategy:
      fail-fast: true
      matrix:
        image: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # OIDC token for Sigstore keyless signing (cosign sign below) - no key material anywhere.
      id-token: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
      IMAGE: ghcr.io/lukislp/claude-queue-${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"
      # Sigstore keyless signature on the multi-arch manifest DIGEST (2026-09-11 hardening), so
      # every tag pointing at it (version, latest, sha-) is covered by one signature. The
      # signing identity is this workflow's OIDC certificate (repo + workflow path + ref), the
      # signature and the transparency-log entry live next to the image in GHCR. The verify
      # step right after is the live proof for this run and the exact identity constraint Flux
      # will use once its ImagePolicy verification is switched on (cluster phase).
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the multi-arch manifest (Sigstore keyless) and verify
        env:
          IDENTITY_REGEXP: '^https://github\.com/lukislp/claude-queue-platform/\.github/workflows/ci-cd\.yml@refs/heads/main$'
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE }}@${DIGEST}" --output text >/dev/null
          echo "signed and verified ${{ env.IMAGE }}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  # The image tag bump of the deploy manifests, committed onto the default branch by the lktec-bot App
  # (module sync: docs/modules/sync.md in lukislp/lktec-bot; the App is a bypass actor of the branch ruleset
  # for this one commit, which GitHub signs itself). Flux picks the new tag up from the branch.
  deploy-bump:
    needs: [get-version, release, docker-manifest-merge, trivy-scan]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    concurrency:
      group: claude-queue-platform-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/deploy-bump.yml@ccd513e3fa47d8a6e6f374fe1d6c561232807b65 # v0.8.0
    with:
      version: ${{ needs.release.outputs.version }}
      images: 'ghcr\.io/lukislp/(claude-queue-api|claude-queue-web)'
      paths: k8s
      branch: main
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  trivy-scan:
    needs: [get-version, docker-manifest-merge]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
      IMAGE: ghcr.io/lukislp/claude-queue-${{ matrix.image }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Gate on CRITICAL
        # A CRITICAL finding with an available fix blocks the rollout (deploy-bump needs this job);
        # unfixed ones are reported above but cannot be acted on yet.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
