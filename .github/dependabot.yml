# Weekly Dependabot updates: GitHub Actions, the three npm apps (dev deps grouped) and both Dockerfiles.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directories:
      - /apps/agent
      - /apps/api
      - /apps/web
    schedule:
      interval: daily
    groups:
      dev:
        dependency-type: development
    # typescript-go (the TS 7 rewrite) isn't supported yet by ts-jest (used in api/agent - its
    # published peer range caps at "<7") or by typescript-eslint (used in web - refuses to run
    # at all under TS 7, "typescript-eslint does not support TS 7.0"), confirmed 2026-09-05.
    # Revisit once those two catch up.
    # eslint 10 removed context.getFilename(); eslint-plugin-react (pulled in by
    # eslint-config-next, latest 7.37.5 as of 2026-09-13) still calls it and declares eslint
    # ^9.7 as its ceiling, so the web lint only runs on eslint 9. Revisit when eslint-plugin-react
    # supports 10.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: daily
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "fix(docker)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
