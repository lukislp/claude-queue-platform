# The bootstrap-only resources - everything Flux's shared reconciler RBAC doesn't cover, so
# it has to be applied by hand once (see k8s/README.md). Deliberately does NOT include
# 03-redis.yaml, 04-api.yaml or 05-web.yaml: all three are Flux-managed now (k8s/flux/ wires
# this repo in, k8s/flux-deploy/ applies exactly that subset) - re-applying them here too
# would just be a second, redundant owner of the same objects. `kubectl apply -k k8s/` covers
# everything in this list in one shot.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 01-secrets-sealed.yaml
  - 02-postgres.yaml
  - 06-routes.yaml
  - 07-netpol.yaml
