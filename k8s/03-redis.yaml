# Redis backs BullMQ (API-key mode). Job state is transient - the tasks table
# in Postgres is the source of truth - so the PVC is not part of Velero backups.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: claude-queue
spec:
  accessModes: ["ReadWriteOnce"]
  # Longhorn (cross-node-replicated, homelab-infra/cluster/11-longhorn-values.yaml) instead of
  # local-path - survives a node dying, even though the BullMQ job state itself is transient
  # (Postgres is the source of truth either way).
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: claude-queue
  annotations:
    # Read by homelab-autodoc's findings engine: acknowledges the no-backup
    # finding instead of leaving it open. The PVC header comment above holds
    # the full rationale.
    autodoc.homelab/accept-no-backup: >-
      BullMQ job state is transient by design - the tasks table in Postgres
      (backed up via Velero, see 02-postgres.yaml) is the source of truth,
      losing this volume only loses in-flight queue state
spec:
  replicas: 1
  # Recreate: RWO volume on local-path must be released before the new pod starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          # Pinned by digest instead of the floating "7-alpine" tag: with a floating tag every
          # pull can silently swap the binary under this pod, and supply-chain scanners (OpenSSF
          # Scorecard "Pinned-Dependencies") cannot tell what actually ran. The digest is the
          # multi-arch INDEX digest (not the arm64 platform digest), so the manifest stays
          # portable across architectures. It is the exact image the cluster was already running
          # when this pin was introduced - redis 7.4.9-alpine - so this is bit-for-bit the same
          # binary, not an upgrade in disguise (7.4.11-alpine is the newer upstream build).
          # Tag AND digest on purpose: the digest is what gets pulled, the tag is the human- and
          # Renovate-readable version. Renovate's kubernetes manager (renovate.json) moves both
          # together from here, so updates stay a reviewable pull request.
          image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
          args: ["--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Every probe sets timeoutSeconds explicitly. The Kubernetes default of 1s is too
          # tight for the arm64 Raspberry Pi nodes this runs on: the weakest node sits close
          # to its memory limit, so an ordinary load spike pushes the probe past one second,
          # liveness fails failureThreshold times in a row and kubelet restarts a container
          # that was only busy.
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: claude-queue
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: redis
