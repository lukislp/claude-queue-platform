# Redis backs BullMQ (API-key mode). Job state is transient - the tasks table
# in Postgres is the source of truth - so the PVC is not part of Velero backups.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: claude-queue
spec:
  accessModes: ["ReadWriteOnce"]
  # Longhorn (cross-node-replicated, homelab-infra/cluster/11-longhorn-values.yaml) instead of
  # local-path - survives a node dying, even though the BullMQ job state itself is transient
  # (Postgres is the source of truth either way).
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: claude-queue
  annotations:
    # Read by homelab-autodoc's findings engine: acknowledges the no-backup
    # finding instead of leaving it open. The PVC header comment above holds
    # the full rationale.
    autodoc.homelab/accept-no-backup: >-
      BullMQ job state is transient by design - the tasks table in Postgres
      (backed up via Velero, see 02-postgres.yaml) is the source of truth,
      losing this volume only loses in-flight queue state
spec:
  replicas: 1
  # Recreate: RWO volume on local-path must be released before the new pod starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: claude-queue
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: redis
