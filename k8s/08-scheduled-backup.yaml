# Daily base backup on top of the continuous WAL archiving configured in k8s/02-postgres.yaml.
# Without a periodic base backup the WAL archive grows forever and recovery would have to
# replay from the very first segment; barman needs a recent base to bound restore time, and
# the 30d retention on the ObjectStore (k8s/02b-objectstore.yaml) only prunes WALs that are
# older than the oldest still-retained backup.
#
# 02:00 deliberately: 03:00 is already taken by studylife-pg's own daily backup and by
# Velero's nightly PVC schedule, 03:30 by Velero's cluster-state schedule. Running an hour
# earlier keeps this cluster's upload off the same window - on three Raspberry Pis sharing
# one uplink, overlapping offsite uploads compete for the same bandwidth - and it still sits
# in the quiet part of the night.
#
# Do NOT apply while the Cluster's spec.plugins entry for barman-cloud.cloudnative-pg.io
# (k8s/02-postgres.yaml) or the ObjectStore r2-claude-queue (k8s/02b-objectstore.yaml) is
# absent: CNPG would log a failing backup every day with no object store to write to.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: claude-queue-pg-daily
  namespace: claude-queue
spec:
  schedule: "0 0 2 * * *" # daily at 02:00 (CNPG uses a 6-field cron format with seconds)
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: claude-queue-pg
