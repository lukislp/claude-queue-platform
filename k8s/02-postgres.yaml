# CNPG operator (cnpg-system) manages pods, hardening and the app credential
# secret "claude-queue-pg-app" (key "uri" is consumed by the API deployment).
# Velero: the volume annotation below only takes effect once the namespace
# "claude-queue" is added to nightly-pvc includedNamespaces in
# homelab-infra cluster/10-velero-values.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: claude-queue-pg
  namespace: claude-queue
spec:
  # Storage migrated to Longhorn (cross-node-replicated) 2026-08-25 via a temporary 2nd
  # instance: bumped to instances:2 with storageClass below already set to longhorn, CNPG
  # streamed a base backup + WAL onto the new instance, then "kubectl cnpg promote
  # claude-queue-pg 2" switched primary onto it before scaling back to 1 here (existing PVCs
  # are immutable in-place, so this replica-then-switchover dance is CNPG's supported way to
  # change storageClass without a manual pg_basebackup/downtime). Uncovered a real gap along
  # the way: the "postgres" NetworkPolicy (07-netpol.yaml) never allowed instance-to-instance
  # traffic, since this cluster had only ever run single-instance before.
  instances: 1
  # No operator-managed PodDisruptionBudget for this cluster. At instances: 1 CNPG still creates
  # a "claude-queue-pg-primary" PDB with minAvailable: 1, which can never allow a disruption -
  # "kubectl get pdb -A" showed it at disruptionsAllowed: 0 permanently, so "kubectl drain" of
  # whichever node held the database hung until someone deleted that operator-owned PDB by hand
  # (and the operator recreated it right after). There is no HA here to protect in the first
  # place: a single instance is restarted wherever it lands either way, the PDB only ever made
  # that restart require a human. enablePDB: false is CNPG's own documented answer for
  # single-instance clusters. If this cluster ever goes to instances: 3, drop this line again -
  # the primary PDB is genuinely wanted then (see homelab-infra
  # cluster/00h-pod-security-and-drain-readiness.md for how to drain a node holding a primary).
  enablePDB: false
  bootstrap:
    initdb:
      database: claude_queue
      owner: claude_queue
  storage:
    size: 2Gi
    storageClass: longhorn
  inheritedMetadata:
    annotations:
      backup.velero.io/backup-volumes: pgdata
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Continuous WAL archiving + daily base backups to Cloudflare R2 (S3-compatible).
  # This cluster runs a SINGLE instance (instances: 1 above), so there is no replica to fail
  # over to: until now the ONLY protection was Velero's nightly kopia snapshot of the pgdata
  # PVC (the inheritedMetadata annotation above), i.e. a crash-consistent file copy taken at
  # most once every 24h. That is a last resort, not a database backup - it cannot do
  # point-in-time recovery, and restoring it means replaying whatever WAL state happened to
  # be on disk at snapshot time. With barman archiving, every committed transaction reaches
  # R2 within archive_timeout, and recovery can target any point inside the retention window.
  #
  # WHERE the archive goes (bucket, prefix, credentials, compression) and HOW LONG it is kept
  # (retentionPolicy 30d) are defined on the ObjectStore in k8s/02b-objectstore.yaml, not in
  # this file - the Barman Cloud Plugin keeps retention on the ObjectStore, not on the Cluster.
  # The reasoning behind those values, for the record: own prefix inside the existing
  # "studylifebackup" bucket rather than the bucket root that studylife-scale uses, because
  # barman lays out <destinationPath>/<serverName>/{base,wals} and retention is enforced per
  # barman server, so two clusters sharing a root would have their retention windows applied
  # against the same tree. A separate prefix keeps the two archives completely disjoint.
  # Deliberately NOT a separate bucket: the R2 API token is scoped to the buckets that exist
  # today, so a new bucket would need a Cloudflare-side change and a token rotation for no
  # benefit here. 30d matches studylife-scale; the database is tiny (single-digit MB), so a
  # month of daily gzip-compressed base backups plus their WAL segments stays far inside R2's
  # free tier, and 30d is the window that actually makes a bad migration or an accidental
  # DELETE recoverable rather than just a node failure.
  #
  # WAL archiving + base backups via the Barman Cloud Plugin (replaces the in-tree
  # spec.backup.barmanObjectStore block, removed in CNPG 1.30). One atomic edit with the
  # removal of that block - a Cluster with neither is a Cluster that is not archiving.
  # serverName is pinned explicitly: it defaults to the Cluster name on both paths, but if it
  # ever drifts barman silently starts a NEW tree in the bucket and the 30d recovery window
  # restarts at zero while archiving keeps reporting healthy. Must stay "claude-queue-pg".
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2-claude-queue
        serverName: claude-queue-pg
