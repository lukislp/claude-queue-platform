# CNPG operator (cnpg-system) manages pods, hardening and the app credential
# secret "claude-queue-pg-app" (key "uri" is consumed by the API deployment).
# Velero: the volume annotation below only takes effect once the namespace
# "claude-queue" is added to nightly-pvc includedNamespaces in
# homelab-infra cluster/10-velero-values.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: claude-queue-pg
  namespace: claude-queue
spec:
  # Storage migrated to Longhorn (cross-node-replicated) 2026-08-25 via a temporary 2nd
  # instance: bumped to instances:2 with storageClass below already set to longhorn, CNPG
  # streamed a base backup + WAL onto the new instance, then "kubectl cnpg promote
  # claude-queue-pg 2" switched primary onto it before scaling back to 1 here (existing PVCs
  # are immutable in-place, so this replica-then-switchover dance is CNPG's supported way to
  # change storageClass without a manual pg_basebackup/downtime). Uncovered a real gap along
  # the way: the "postgres" NetworkPolicy (07-netpol.yaml) never allowed instance-to-instance
  # traffic, since this cluster had only ever run single-instance before.
  instances: 1
  # No operator-managed PodDisruptionBudget for this cluster. At instances: 1 CNPG still creates
  # a "claude-queue-pg-primary" PDB with minAvailable: 1, which can never allow a disruption -
  # "kubectl get pdb -A" showed it at disruptionsAllowed: 0 permanently, so "kubectl drain" of
  # whichever node held the database hung until someone deleted that operator-owned PDB by hand
  # (and the operator recreated it right after). There is no HA here to protect in the first
  # place: a single instance is restarted wherever it lands either way, the PDB only ever made
  # that restart require a human. enablePDB: false is CNPG's own documented answer for
  # single-instance clusters. If this cluster ever goes to instances: 3, drop this line again -
  # the primary PDB is genuinely wanted then (see homelab-infra
  # cluster/00h-pod-security-and-drain-readiness.md for how to drain a node holding a primary).
  enablePDB: false
  bootstrap:
    initdb:
      database: claude_queue
      owner: claude_queue
  storage:
    size: 2Gi
    storageClass: longhorn
  inheritedMetadata:
    annotations:
      backup.velero.io/backup-volumes: pgdata
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
