# Points Flux at this repo. Needs write access, since image-automation-controller
# pushes commits for new image tags directly to main (see 04-image-update-automation.yaml).
# Reuses the cluster-wide "studylife-git-auth" secret (flux-system, managed in homelab-infra).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: claude-queue-platform
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/lukislp/claude-queue-platform.git
  ref:
    branch: main
  secretRef:
    name: studylife-git-auth
