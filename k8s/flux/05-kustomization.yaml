# Applies EXCLUSIVELY k8s/flux-deploy/ (the curated Flux-managed subset - Deployments,
# Services, PVCs). Namespace, SealedSecret, CNPG cluster, routes and network policies
# stay bootstrap-only: the reconciler's least-privilege ClusterRole
# (homelab-infra flux/01-reconciler-rbac.yaml) does not cover those kinds.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-queue-deploy
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: claude-queue-platform
  path: ./k8s/flux-deploy
  prune: true
  wait: true
  timeout: 3m
