# NEXT_PUBLIC_API_URL is baked in at image build time - the image must be built
# with --build-arg NEXT_PUBLIC_API_URL=https://claudequeue-api.lukas2311-homelab.com
# (and --platform linux/arm64).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: claude-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: ghcr.io/lukislp/claude-queue-web:1.2.31 # set by the deploy-bump job (CI) on every release
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            # The Next.js standalone server only writes the two paths mounted below; the
            # prerendered .next/server tree ships in the image and stays untouched.
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          # Every probe sets timeoutSeconds explicitly. The Kubernetes default of 1s is too
          # tight for the arm64 Raspberry Pi nodes this runs on: the weakest node sits close
          # to its memory limit, so an ordinary load spike pushes the probe past one second,
          # liveness fails failureThreshold times in a row and kubelet restarts a container
          # that was only busy.
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Next.js writes its runtime cache here; root filesystem stays untouched.
            - name: next-cache
              mountPath: /app/.next/cache
            # Node writes its V8 compile cache into /tmp, and Next uses it for request
            # body spooling.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: claude-queue
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: http
