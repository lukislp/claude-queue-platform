# R2 credentials for the CNPG barman object-store backup (k8s/02-postgres.yaml). Same
# Cloudflare R2 token the studylife-scale cluster and Velero already use - deliberately one
# token for every offsite backup path, so revoking it at Cloudflare kills them all at once
# (see homelab-infra cluster/00g-velero-backups.md). Sealed against this cluster's
# sealed-secrets controller with scope "strict": it only decrypts as
# claude-queue/r2-backup-credentials, so the ciphertext below is safe to keep in git.
#
# Regenerate after a token rotation (kubeseal must match the controller version,
# kube-system/sealed-secrets-controller, currently 0.38.4):
#
#   kubeseal --fetch-cert --controller-name sealed-secrets-controller \
#     --controller-namespace kube-system > cert.pem
#   kubectl create secret generic r2-backup-credentials -n claude-queue \
#     --from-literal=ACCESS_KEY_ID="$AK" --from-literal=ACCESS_SECRET_KEY="$SK" \
#     --dry-run=client -o yaml \
#     | kubeseal --cert cert.pem --format yaml --scope strict > k8s/01b-r2-backup-credentials-sealed.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: r2-backup-credentials
  namespace: claude-queue
spec:
  encryptedData:
    ACCESS_KEY_ID: 
    ACCESS_SECRET_KEY: 
  template:
    metadata:
      name: r2-backup-credentials
      namespace: claude-queue
