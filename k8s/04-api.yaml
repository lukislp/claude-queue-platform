# Image must be built for linux/arm64 (docker buildx --platform linux/arm64).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: claude-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/lukislp/claude-queue-api:1.2.1 # {"$imagepolicy": "flux-system:claude-queue-api"}
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: PORT
              value: "4000"
            - name: WEB_ORIGIN
              value: https://claudequeue.lukas2311-homelab.com
            - name: REDIS_URL
              value: redis://redis:6379
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: claude-queue-pg-app # created by the CNPG operator
                  key: uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: claude-queue-secrets
                  key: JWT_SECRET
            - name: CLAUDE_KEY_ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: claude-queue-secrets
                  key: CLAUDE_KEY_ENCRYPTION_SECRET
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # /health checks DB connectivity, not just that the process is listening.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30 # DB migrations run at boot
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: claude-queue
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: http
