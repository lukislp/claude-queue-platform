# Image must be built for linux/arm64 (docker buildx --platform linux/arm64).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: claude-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/lukislp/claude-queue-api:1.2.31 # set by the deploy-bump job (CI) on every release
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: PORT
              value: "4000"
            - name: WEB_ORIGIN
              value: https://claudequeue.lukas2311-homelab.com
            - name: REDIS_URL
              value: redis://redis:6379
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: claude-queue-pg-app # created by the CNPG operator
                  key: uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: claude-queue-secrets
                  key: JWT_SECRET
            - name: CLAUDE_KEY_ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: claude-queue-secrets
                  key: CLAUDE_KEY_ENCRYPTION_SECRET
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            # All state lives in Postgres and Redis - nothing is written into the image
            # layer except Node's own temp files, which the emptyDir below covers.
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # /health checks DB connectivity, not just that the process is listening.
          # Every probe sets timeoutSeconds explicitly. The Kubernetes default of 1s is too
          # tight for the arm64 Raspberry Pi nodes this runs on: the weakest node sits close
          # to its memory limit, so an ordinary load spike pushes the probe past one second,
          # liveness fails failureThreshold times in a row and kubelet restarts a container
          # that was only busy.
          # The startup probe's period grew with it so it stays longer than that timeout;
          # its total budget went from 150s to 300s, which a boot-time migration on a Pi
          # can genuinely need.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30 # DB migrations run at boot
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Node writes its V8 compile cache into /tmp on every start.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: claude-queue
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: http
